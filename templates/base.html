<!doctype html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PillPilot{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">PillPilot</a>
            {% if session.get('logged_in') %}
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                    aria-controls="mainNavbar" aria-expanded="false" aria-label="Vis navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'dashboard' %} active{% endif %}"
                           href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint in ('borgere', 'borger_view') %} active{% endif %}"
                           href="{{ url_for('borgere') }}" {% if request.endpoint in ('borgere', 'borger_view') %}aria-current="page"{% endif %}>Borgere</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link{% if request.endpoint == 'pilledispensere' %} active{% endif %}"
                           href="{{ url_for('pilledispensere') }}" {% if request.endpoint == 'pilledispensere' %}aria-current="page"{% endif %}>Pilledispensere</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center flex-wrap gap-3">
                    <span class="navbar-text text-white">
                        {{ session.get('fornavn') }} {{ session.get('efternavn') }}
                    </span>
                    <form action="{{ url_for('logout') }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <button type="submit" class="btn btn-outline-light btn-sm">Log ud</button>
                    </form>
                </div>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="container py-4">
        {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>
</html>
