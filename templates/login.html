{% extends "base.html" %}
{% block title %}Log ind · PillPilot{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-12 col-md-7 col-lg-5">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h3 mb-2">Log ind</h1>
                <p class="text-secondary mb-4">Brug din kontaktpersonkonto.</p>

                <form action="{{ url_for('login') }}" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control"
                               value="{{ email }}" autocomplete="username"
                               maxlength="250" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Adgangskode</label>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" maxlength="128" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log ind</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
