[project]
name = "pillpilot"
version = "0.5.0"
description = "PillPilot API med PostgreSQL"
requires-python = ">=3.14,<3.15"
dependencies = [
    "apiflask>=3.0,<4",
    "psycopg[binary]>=3.3,<4",
    "joserfc>=1.7.4,<2",
    "Werkzeug>=3.1,<4",
    "click>=8.1,<9",
    "flask>=3.1,<4",
    "requests>=2.32,<3",
    "flask-session>=0.8,<0.9",
    "cachelib>=0.13,<0.14",
    "flask-wtf>=1.2,<2",
]

[tool.uv]
package = false
